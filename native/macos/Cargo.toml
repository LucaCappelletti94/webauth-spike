[package]
name = "webauth-probe-macos"
version = "0.1.0"
edition = "2021"
publish = false

# Runs on macOS only. security-framework and apple-native-keyring-store target
# Apple platforms, so `cargo build` on other hosts will not link.

[[bin]]
name = "security_framework_probe"
path = "src/bin/security_framework_probe.rs"

[[bin]]
name = "apple_keyring_probe"
path = "src/bin/apple_keyring_probe.rs"

[[bin]]
name = "secure_enclave_probe"
path = "src/bin/secure_enclave_probe.rs"

[[bin]]
name = "secure_enclave_n2_probe"
path = "src/bin/secure_enclave_n2_probe.rs"

[dependencies]
security-framework = "=3.7.0"
apple-native-keyring-store = { version = "=1.0.1", features = ["protected"] }
keyring-core = "=1.0.0"
